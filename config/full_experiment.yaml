# =======================
# Full-scale configuration
# =======================
seed_list: [13, 17, 23]
run_name: "crest_full"
output_dir: "results/full"

datasets:
  imagenet_1k:
    url: "https://example.com/imagenet_1k.tar"
    sha256: "e3b0c44298fc1c149afbf4c8996fb924"
    subset: null
    image_size: 512
  imagenet_64:
    url: "https://example.com/imagenet_64.tar"
    sha256: "e3b0c44298fc1c149afbf4c8996fb924"
    subset: null
    image_size: 64

hardware_emulation:
  vram_gb: 4

experiments:
  - name: full_4gb_efficiency
    type: crest_4gb_efficiency
    model: "DiT-XL/2-512"
    resolution: 512
    num_images: 50000
    variants: ["vanilla", "ahvqc", "ahvqc+baac", "crest-nosaliency", "crest-full"]
  - name: full_saliency_allocation
    type: crest_saliency_allocation
    model: "DiT-XL/2-256"
    resolution: 256
    num_images: 50000
    bit_budgets: [2.0, 1.0, 0.5, 0.35, 0.2]
    saliency_thresholds: [0.1, 0.2, 0.3, 0.5]
  - name: full_privacy_carbon
    type: crest_privacy_carbon
    model: "DiT-XL/2-256"
    resolution: 256
    num_images: 100000
    epsilon_values: [8.0, 4.0, 2.0, 1.0]
    carbon_aware: true
